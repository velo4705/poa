name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-smoke:
    name: build + stdio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: stdio smoke test
        shell: bash
        run: POA_INSPECT=$(node -e "process.stdout.write(process.execPath)") node scripts/smoke.mjs

  shim:
    name: poa-shim build + compliance test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: build and run poa-shim tests
        shell: bash
        run: cc -Wall -Wextra -std=c11 shim/poa_shim.c shim/poa_shim_test.c -o poa-shim-test && ./poa-shim-test

  zstd-poa:
    name: zstd via POA compat-shim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: native build, then the exe actually runs there
        # ubuntu-latest: cross-built for x86_64-windows-gnu, PE magic checked
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - name: install cmake, ninja (windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: diagnostic — cmake + minimal configure
        shell: bash
        run: |
          echo "=== cmake --version ==="; cmake --version || echo "cmake: NOT FOUND"
          echo "=== zig --version ==="; zig version || echo "zig: NOT FOUND (OK on windows-native lane)"
          echo "=== minimal cmake configure ==="
          mkdir -p /tmp/poa-ci-diag && cd /tmp/poa-ci-diag
          printf 'cmake_minimum_required(VERSION 3.16)\nproject(poaci-diag C)\nadd_executable(poaci-diag main.c)\n' > CMakeLists.txt
          printf 'int main(void){return 0;}\n' > main.c
          cmake -S . -B build -GNinja 2>&1 && cmake --build build 2>&1 && echo "MINIMAL CMAKE: OK" || echo "MINIMAL CMAKE: FAILED rc=$? (diagnostic only — not gating)"
      - name: clone zstd v1.5.7 (BSD)
        shell: bash
        run: git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git "$GITHUB_WORKSPACE/zstd"
      - name: compat-shim build via poa
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export ZSTD_SRC="$GITHUB_WORKSPACE/zstd"
          export POA_M2_WORK="$RUNNER_TEMP/poa-zstd-work"
          node scripts/m2-compat-zstd.mjs

  libarchive-poa-ubuntu:
    name: libarchive — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja, mingw binutils (windres)
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build binutils-mingw-w64-x86-64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: diagnostic — cmake + minimal configure
        run: |
          echo "=== cmake --version ==="; cmake --version || echo "cmake: NOT FOUND"
          echo "=== zig --version ==="; zig version || echo "zig: NOT FOUND (OK on windows-native lane)"
          echo "=== minimal cmake configure ==="
          mkdir -p /tmp/poa-ci-diag && cd /tmp/poa-ci-diag
          printf 'cmake_minimum_required(VERSION 3.16)\nproject(poaci-diag C)\nadd_executable(poaci-diag main.c)\n' > CMakeLists.txt
          printf 'int main(void){return 0;}\n' > main.c
          cmake -S . -B build -GNinja 2>&1 && cmake --build build 2>&1 && echo "MINIMAL CMAKE: OK" || echo "MINIMAL CMAKE: FAILED rc=$? (diagnostic only — not gating)"
      - name: clone libarchive
        run: git clone --depth 1 https://github.com/libarchive/libarchive.git "$GITHUB_WORKSPACE/libarchive"
      - name: build bsdtar.exe via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export LIBARCHIVE_SRC="$GITHUB_WORKSPACE/libarchive"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-libarchive-work"
          node scripts/m2-compat-libarchive.mjs
          find "$POA_M2_WORK" -name 'bsdtar.exe' -exec sh -c 'head -c 2 "$1" | od -An -tx1 | grep -q "4d 5a" && echo "PE MAGIC OK: $1"' _ {} \;

  libarchive-poa-windows:
    name: libarchive — POA build, windows-x86_64 (native, runs bsdtar --version)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        shell: pwsh
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: diagnostic — cmake + minimal configure
        shell: bash
        run: |
          echo "=== cmake --version ==="; cmake --version || echo "cmake: NOT FOUND"
          echo "=== zig --version ==="; zig version || echo "zig: NOT FOUND (OK on windows-native lane)"
          echo "=== minimal cmake configure ==="
          mkdir -p /tmp/poa-ci-diag && cd /tmp/poa-ci-diag
          printf 'cmake_minimum_required(VERSION 3.16)\nproject(poaci-diag C)\nadd_executable(poaci-diag main.c)\n' > CMakeLists.txt
          printf 'int main(void){return 0;}\n' > main.c
          cmake -S . -B build -GNinja 2>&1 && cmake --build build 2>&1 && echo "MINIMAL CMAKE: OK" || echo "MINIMAL CMAKE: FAILED rc=$? (diagnostic only — not gating)"
      - name: clone libarchive
        run: git clone --depth 1 https://github.com/libarchive/libarchive.git "$env:GITHUB_WORKSPACE/libarchive"
        shell: pwsh
      - name: build + run bsdtar via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export LIBARCHIVE_SRC="$GITHUB_WORKSPACE/libarchive"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-libarchive-work"
          node scripts/m2-compat-libarchive.mjs

  cmark-poa-ubuntu:
