name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-smoke:
    name: build + stdio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: stdio smoke test
        shell: bash
        run: POA_INSPECT=$(node -e "process.stdout.write(process.execPath)") node scripts/smoke.mjs

  shim:
    name: poa-shim build + compliance test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: build and run poa-shim tests
        shell: bash
        run: cc -Wall -Wextra -std=c11 shim/poa_shim.c shim/poa_shim_test.c -o poa-shim-test && ./poa-shim-test

  zstd-poa:
    name: zstd via POA compat-shim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: native build, then the exe actually runs there
        # ubuntu-latest: cross-built for x86_64-windows-gnu, PE magic checked
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - name: install cmake, ninja (windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone zstd v1.5.7 (BSD)
        shell: bash
        run: git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git "$GITHUB_WORKSPACE/zstd"
      - name: compat-shim build via poa
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export ZSTD_SRC="$GITHUB_WORKSPACE/zstd"
          export POA_M2_WORK="$RUNNER_TEMP/poa-zstd-work"
          node scripts/m2-compat-zstd.mjs

  sqlite-poa-ubuntu:
    name: sqlite — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: download SQLite amalgamation 3.54.1 (SHA3-256 pinned)
        run: |
          curl -sLo amalgamation.zip https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
          python3 -c "import hashlib; d=open('amalgamation.zip','rb').read(); h=hashlib.sha3_256(d).hexdigest(); print(h); assert h == '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30', 'SHA3-256 MISMATCH'"
          python3 -c "import zipfile; zipfile.ZipFile('amalgamation.zip').extractall('amalg')"
      - name: build sqlite3 via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_SQLITE_SRC="$GITHUB_WORKSPACE/amalg/sqlite-amalgamation-3540100"
          export POA_CMAKE_SOURCE="$GITHUB_WORKSPACE/scripts/compat-sqlite"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-sqlite-work"
          node scripts/m2-compat-sqlite.mjs
          find "$POA_M2_WORK" -name 'sqlite3.exe' -exec sh -c 'head -c 2 "$1" | od -An -tx1 | grep -q "4d 5a" && echo "PE MAGIC OK: $1"' _ {} \;

  sqlite-poa-windows:
    name: sqlite — POA build, windows-x86_64 (native, runs --version)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        shell: pwsh
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: download SQLite amalgamation 3.54.1 (SHA3-256 pinned)
        shell: bash
        run: |
          curl -sLo amalgamation.zip https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
          python -c "import hashlib; d=open('amalgamation.zip','rb').read(); h=hashlib.sha3_256(d).hexdigest(); print(h); assert h == '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30', 'SHA3-256 MISMATCH'"
          python -c "import zipfile; zipfile.ZipFile('amalgamation.zip').extractall('amalg')"
      - name: build + run sqlite3 via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_SQLITE_SRC="$GITHUB_WORKSPACE/amalg/sqlite-amalgamation-3540100"
          export POA_CMAKE_SOURCE="$GITHUB_WORKSPACE/scripts/compat-sqlite"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-sqlite-work"
          node scripts/m2-compat-sqlite.mjs

  sqlite-poa-macos:
    name: sqlite — POA build, macos-aarch64 (native, runs --version)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        run: brew install cmake ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: download SQLite amalgamation 3.54.1 (SHA3-256 pinned)
        run: |
          curl -sLo amalgamation.zip https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
          python3 -c "import hashlib; d=open('amalgamation.zip','rb').read(); h=hashlib.sha3_256(d).hexdigest(); print(h); assert h == '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30', 'SHA3-256 MISMATCH'"
          python3 -c "import zipfile; zipfile.ZipFile('amalgamation.zip').extractall('amalg')"
      - name: build + run sqlite3 via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_SQLITE_SRC="$GITHUB_WORKSPACE/amalg/sqlite-amalgamation-3540100"
          export POA_CMAKE_SOURCE="$GITHUB_WORKSPACE/scripts/compat-sqlite"
          export POA_TARGET="macos-aarch64"
          export POA_M2_WORK="$RUNNER_TEMP/poa-sqlite-work"
          node scripts/m2-compat-sqlite.mjs
