    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone cmark
        run: git clone --depth 1 https://github.com/commonmark/cmark.git "$GITHUB_WORKSPACE/cmark"
      - name: build cmark via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export CMARK_SRC="$GITHUB_WORKSPACE/cmark"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-cmark-work"
          node scripts/m2-compat-cmark.mjs

  cmark-poa-windows:
    name: cmark — POA build, windows-x86_64 (native, runs cmark --version)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        shell: pwsh
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone cmark
        run: git clone --depth 1 https://github.com/commonmark/cmark.git "$env:GITHUB_WORKSPACE/cmark"
        shell: pwsh
      - name: build + run cmark via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export CMARK_SRC="$GITHUB_WORKSPACE/cmark"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-cmark-work"
          node scripts/m2-compat-cmark.mjs

  cmark-poa-macos:
    name: cmark — POA build, macos-aarch64 (native, runs cmark --version)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        run: brew install cmake ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone cmark
        run: git clone --depth 1 https://github.com/commonmark/cmark.git "$GITHUB_WORKSPACE/cmark"
      - name: build + run cmark via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export CMARK_SRC="$GITHUB_WORKSPACE/cmark"
          export POA_TARGET="macos-aarch64"
          export POA_M2_WORK="$RUNNER_TEMP/poa-cmark-work"
          node scripts/m2-compat-cmark.mjs

  mbedtls-poa-ubuntu:
    name: mbedtls — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja, python + deps
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build python3-jinja2 python3-jsonschema
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone Mbed TLS (recursive submodules)
        run: |
          git clone --recurse-submodules https://github.com/Mbed-TLS/mbedtls.git "$GITHUB_WORKSPACE/mbedtls"
      - name: build Mbed TLS via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export MBEDTLS_SRC="$GITHUB_WORKSPACE/mbedtls"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-mbedtls-work"
          export PATH="$RUNNER_TEMP/poa-venv/Scripts:$PATH"
          node scripts/m2-mbedtls.mjs

  mbedtls-poa-windows:
    name: mbedtls — POA build, windows-x86_64 (native, runs verifier)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja, python, perl + venv packages
        shell: pwsh
        run: |
          choco install cmake ninja python strawberryperl -y
          python -m venv "$env:RUNNER_TEMP/poa-venv"
          & "$env:RUNNER_TEMP/poa-venv/Scripts/python.exe" -m pip install --quiet jinja2 jsonschema
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone Mbed TLS (recursive submodules)
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/Mbed-TLS/mbedtls.git "$GITHUB_WORKSPACE/mbedtls"
        

      - name: build Mbed TLS via POA, run PSA SHA-256 verifier
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export MBEDTLS_SRC="$GITHUB_WORKSPACE/mbedtls"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-mbedtls-work"
          export PATH="$RUNNER_TEMP/poa-venv/Scripts:$PATH"
          node scripts/m2-mbedtls.mjs

  mbedtls-poa-macos:
    name: mbedtls — POA build, macos-aarch64 (native, runs verifier)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja, python + deps
        run: |
          brew install cmake ninja
          python3 -m venv /tmp/poa-mbedtls-venv
          /tmp/poa-mbedtls-venv/bin/pip install --quiet jinja2 jsonschema
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone Mbed TLS (recursive submodules)
        run: |
          git clone --recurse-submodules https://github.com/Mbed-TLS/mbedtls.git "$GITHUB_WORKSPACE/mbedtls"
      - name: build Mbed TLS via POA, run PSA SHA-256 verifier
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export MBEDTLS_SRC="$GITHUB_WORKSPACE/mbedtls"
          export POA_TARGET="macos-aarch64"
          export POA_M2_WORK="$RUNNER_TEMP/poa-mbedtls-work"
          export PATH="/tmp/poa-mbedtls-venv/bin:$PATH"
          node scripts/m2-mbedtls.mjs

  cjson-poa-ubuntu:
    name: cJSON — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone cJSON
        run: git clone --depth 1 https://github.com/DaveGamble/cJSON.git "$GITHUB_WORKSPACE/cJSON"
      - name: fix cJSON tests for non-MSVC compilers (upstream CMakeLists only sees MSVC)
        run: python3 "$GITHUB_WORKSPACE/scripts/ci-patches/patch-cjson-tests.py" "$GITHUB_WORKSPACE/cJSON"
        shell: bash
      - name: build cJSON via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export CJSON_SRC="$GITHUB_WORKSPACE/cJSON"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-cjson-work"
          node scripts/m2-compat-cjson.mjs

  cjson-poa-windows:
    name: cJSON — POA build, windows-x86_64 (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        shell: pwsh
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone cJSON
        run: git clone --depth 1 https://github.com/DaveGamble/cJSON.git "$env:GITHUB_WORKSPACE/cJSON"
        shell: pwsh
      - name: build + run cJSON via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export CJSON_SRC="$GITHUB_WORKSPACE/cJSON"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-cjson-work"
          node scripts/m2-compat-cjson.mjs

  cjson-poa-macos:
    name: cJSON — POA build, macos-aarch64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        run: brew install cmake ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone cJSON
        run: git clone --depth 1 https://github.com/DaveGamble/cJSON.git "$GITHUB_WORKSPACE/cJSON"
      - name: build + run cJSON via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export CJSON_SRC="$GITHUB_WORKSPACE/cJSON"
          export POA_TARGET="macos-aarch64"
          export POA_M2_WORK="$RUNNER_TEMP/poa-cjson-work"
          node scripts/m2-compat-cjson.mjs

  jansson-poa-ubuntu:
    name: jansson — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone jansson
        run: git clone --depth 1 https://github.com/akheron/jansson.git "$GITHUB_WORKSPACE/jansson"
      - name: build jansson via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export JANSSON_SRC="$GITHUB_WORKSPACE/jansson"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-jansson-work"
          node scripts/m2-compat-jansson.mjs

  jansson-poa-windows:
    name: jansson — POA build, windows-x86_64 (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        shell: pwsh
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone jansson
        run: git clone --depth 1 https://github.com/akheron/jansson.git "$env:GITHUB_WORKSPACE/jansson"
        shell: pwsh
      - name: build + run jansson via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export JANSSON_SRC="$GITHUB_WORKSPACE/jansson"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-jansson-work"
          node scripts/m2-compat-jansson.mjs

  jansson-poa-macos:
    name: jansson — POA build, macos-aarch64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        run: brew install cmake ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone jansson
        run: git clone --depth 1 https://github.com/akheron/jansson.git "$GITHUB_WORKSPACE/jansson"
      - name: build + run jansson via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export JANSSON_SRC="$GITHUB_WORKSPACE/jansson"
          export POA_TARGET="macos-aarch64"
          export POA_M2_WORK="$RUNNER_TEMP/poa-jansson-work"
          node scripts/m2-compat-jansson.mjs

  libzip-poa-ubuntu:
    name: libzip — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone zlib
        run: git clone --depth 1 https://github.com/madler/zlib.git "$GITHUB_WORKSPACE/zlib"
      - name: build zlib (needed for libzip)
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          cmake -S "$GITHUB_WORKSPACE/zlib" -B /tmp/opencode/zlib-build -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$POA_CMAKE_TOOLCHAIN_FILE" \
            -DCMAKE_BUILD_TYPE=Release -DZLIB_BUILD_SHARED=OFF -DCMAKE_INSTALL_PREFIX=/tmp/opencode/zlocal -DZLIB_BUILD_TESTING=OFF
          cmake --build /tmp/opencode/zlib-build
          cmake --install /tmp/opencode/zlib-build
      - name: clone libzip
        run: git clone --depth 1 https://github.com/nih-at/libzip.git "$GITHUB_WORKSPACE/libzip"
      - name: fix libzip escape for cross-compilation
        run: python3 "$GITHUB_WORKSPACE/scripts/ci-patches/patch-libzip-escape.py" "$GITHUB_WORKSPACE/libzip"
        shell: bash
      - name: build libzip via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export LIBZIP_SRC="$GITHUB_WORKSPACE/libzip"
          export ZLIB_ROOT=/tmp/opencode/zlocal
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-libzip-work"
          node scripts/m2-compat-libzip.mjs

  libzip-poa-windows:
    name: libzip — POA build, windows-x86_64 (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        shell: pwsh
        run: choco install cmake ninja -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone zlib
        run: git clone --depth 1 https://github.com/madler/zlib.git "$env:GITHUB_WORKSPACE/zlib"
        shell: pwsh
      - name: build zlib
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE/zlib" -B zlib-build -GNinja -DCMAKE_BUILD_TYPE=Release -DZLIB_BUILD_SHARED=OFF -DCMAKE_INSTALL_PREFIX="C:\zlocal" -DZLIB_BUILD_TESTING=OFF
          cmake --build zlib-build
          cmake --install zlib-build
      - name: clone libzip
        run: git clone --depth 1 https://github.com/nih-at/libzip.git "$env:GITHUB_WORKSPACE/libzip"
        shell: pwsh
      - name: fix libzip escape for cross-compilation (upstream assumes cmd.exe but Linux expels)
        run: python3 "$GITHUB_WORKSPACE/scripts/ci-patches/patch-libzip-escape.py" "$GITHUB_WORKSPACE/libzip"
        shell: bash
      - name: build + run libzip via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export LIBZIP_SRC="$GITHUB_WORKSPACE/libzip"
          export ZLIB_ROOT="/c/zlocal"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-libzip-work"
          node scripts/m2-compat-libzip.mjs

  libzip-poa-macos:
    name: libzip — POA build, macos-aarch64 (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cmake, ninja
        run: brew install cmake ninja zlib
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: clone libzip
        run: git clone --depth 1 https://github.com/nih-at/libzip.git "$GITHUB_WORKSPACE/libzip"
      - name: build + run libzip via POA
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export LIBZIP_SRC="$GITHUB_WORKSPACE/libzip"
          export ZLIB_ROOT="$(brew --prefix zlib)"
          export POA_TARGET="macos-aarch64"
          export POA_M2_WORK="$RUNNER_TEMP/poa-libzip-work"
          node scripts/m2-compat-libzip.mjs

  sqlite-poa-ubuntu:
    name: sqlite — POA build, ubuntu → windows-x86_64 cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig, cmake, ninja
        run: sudo apt-get update && sudo apt-get install -y zig cmake ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: diagnostic — cmake + minimal configure
        shell: bash
        run: |
          echo "=== cmake --version ==="; cmake --version || echo "cmake: NOT FOUND"
          echo "=== zig --version ==="; zig version || echo "zig: NOT FOUND (OK on windows-native lane)"
          echo "=== minimal cmake configure ==="
          mkdir -p /tmp/poa-ci-diag && cd /tmp/poa-ci-diag
          printf 'cmake_minimum_required(VERSION 3.16)\nproject(poaci-diag C)\nadd_executable(poaci-diag main.c)\n' > CMakeLists.txt
          printf 'int main(void){return 0;}\n' > main.c
          cmake -S . -B build -GNinja 2>&1 && cmake --build build 2>&1 && echo "MINIMAL CMAKE: OK" || echo "MINIMAL CMAKE: FAILED rc=$? (diagnostic only — not gating)"
      - name: download SQLite amalgamation 3.54.1 (SHA3-256 pinned)
        run: |
          curl -sLo amalgamation.zip https://sqlite.org/2026/sqlite-amalgamation-3540100.zip
          python3 -c "import hashlib; d=open('amalgamation.zip','rb').read(); h=hashlib.sha3_256(d).hexdigest(); print(h); assert h == '92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30', 'SHA3-256 MISMATCH'"
          python3 -c "import zipfile; zipfile.ZipFile('amalgamation.zip').extractall('amalg')"
      - name: build sqlite3 via POA (cross → windows-x86_64-mingw)
        shell: bash
        run: |
          export POA_ROOT="$GITHUB_WORKSPACE"
          export POA_SQLITE_SRC="$GITHUB_WORKSPACE/amalg/sqlite-amalgamation-3540100"
          export POA_CMAKE_SOURCE="$GITHUB_WORKSPACE/scripts/compat-sqlite"
          export POA_CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/zig-cross/windows-gnu-toolchain.cmake"
          export POA_TARGET="windows-x86_64-mingw"
          export POA_M2_WORK="$RUNNER_TEMP/poa-sqlite-work"
          node scripts/m2-compat-sqlite.mjs
          find "$POA_M2_WORK" -name 'sqlite3.exe' -exec sh -c 'head -c 2 "$1" | od -An -tx1 | grep -q "4d 5a" && echo "PE MAGIC OK: $1"' _ {} \;

